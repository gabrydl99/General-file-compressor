name: Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller imageio-ffmpeg
          pip install --no-deps PyMuPDF

      - name: FFmpeg
        shell: pwsh
        run: |
          $ff = python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())"
          New-Item -ItemType Directory -Force packaging/ffmpeg | Out-Null
          Copy-Item $ff packaging/ffmpeg/ffmpeg.exe

      - name: Check that the app starts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; app=QApplication([]); from general_file_compressor import theme as T; from general_file_compressor.window import MainWindow; d,t=T.load_fonts(); w=MainWindow(d,t); print('window ok')"

      - name: Build the exe folder
        run: python -m PyInstaller --noconfirm --clean packaging/general_file_compressor.spec

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/General File Compressor" -DestinationPath "General.File.Compressor.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: General-File-Compressor-Windows
          path: General.File.Compressor.zip
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: General.File.Compressor.zip
